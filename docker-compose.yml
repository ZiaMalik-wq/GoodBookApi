services:
  mongo:
    image: mongo:6
    container_name: goodbooks_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .        # Dockerfile is in project root
      dockerfile: Dockerfile
    container_name: goodbooks_api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongo

volumes:
  mongo_data:
